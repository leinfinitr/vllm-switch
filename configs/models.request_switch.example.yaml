# Copy this file to configs/models.request_switch.local.yaml and replace every
# /path/to value. The local file is ignored by Git.
models:
  qwen-1.5b:
    backend_url: http://127.0.0.1:8101
    served_model_name: qwen-1.5b
    sleep_level: 1
    wake_tags: null
    cwd: /path/to/vllm-checkout
    env:
      VLLM_SERVER_DEV_MODE: "1"
      VLLM_CPU_BACKUP_COORDINATOR: daemon
      VLLM_CPU_BACKUP_COORDINATOR_URL: http://127.0.0.1:9000
      VLLM_CPU_BACKUP_COORDINATOR_MODEL_ID: qwen-1.5b
      VLLM_CPU_BACKUP_COORDINATOR_CLIENT_ID: qwen-1.5b
      # Optional override; otherwise ModelSpec injects the same repository tmp path.
      VLLM_CPU_BACKUP_DISK_DIR: /home/ljl/research-systems/vllm-model-switch-controller/tmp
      VLLM_SLEEP_PROFILE_PATH: /tmp/qwen-1.5b-sleep-profile.jsonl
    launch_command:
      - /path/to/research-venv/bin/vllm
      - serve
      - /path/to/Qwen2.5-1.5B-Instruct
      - --host
      - 127.0.0.1
      - --port
      - "8101"
      - --served-model-name
      - qwen-1.5b
      - --enable-sleep-mode
      - --enable-request-id-headers
      - --gpu-memory-utilization
      - "0.70"
      - --max-model-len
      - "1024"
      - --enforce-eager
      - --dtype
      - half
  qwen-3b:
    backend_url: http://127.0.0.1:8102
    served_model_name: qwen-3b
    sleep_level: 1
    wake_tags: null
    cwd: /path/to/vllm-checkout
    env:
      VLLM_SERVER_DEV_MODE: "1"
      VLLM_CPU_BACKUP_COORDINATOR: daemon
      VLLM_CPU_BACKUP_COORDINATOR_URL: http://127.0.0.1:9000
      VLLM_CPU_BACKUP_COORDINATOR_MODEL_ID: qwen-3b
      VLLM_CPU_BACKUP_COORDINATOR_CLIENT_ID: qwen-3b
      VLLM_CPU_BACKUP_DISK_DIR: /home/ljl/research-systems/vllm-model-switch-controller/tmp
      VLLM_SLEEP_PROFILE_PATH: /tmp/qwen-3b-sleep-profile.jsonl
    launch_command:
      - /path/to/research-venv/bin/vllm
      - serve
      - /path/to/Qwen2.5-3B-Instruct
      - --host
      - 127.0.0.1
      - --port
      - "8102"
      - --served-model-name
      - qwen-3b
      - --enable-sleep-mode
      - --enable-request-id-headers
      - --gpu-memory-utilization
      - "0.70"
      - --max-model-len
      - "1024"
      - --enforce-eager
      - --dtype
      - half
controller:
  # The management API is unauthenticated. Bind to a trusted interface.
  host: 127.0.0.1
  port: 9000
  policy: always_sleep_previous
  startup_awake_model: qwen-1.5b
  request_timeout_s: 600
  switch_timeout_s: 600
  metrics_path: results/request_switch/controller_events.jsonl
  cpu_memory_reclaim_available_ratio: 0.15
  cpu_memory_recovery_available_ratio: 0.20
  cpu_memory_poll_interval_s: 0.5
  cpu_memory_pressure_consecutive_samples: 3
  cpu_memory_reclaim_cooldown_s: 2.0
