models:
  qwen-a:
    backend_url: http://127.0.0.1:8101
    served_model_name: qwen-a
    sleep_level: 1
    cwd: /home/ljl/research-systems/vllm-model-switch-controller
    env:
      CUDA_HOME: /home/ljl/cuda-13.0
      PATH: /home/ljl/.local/bin:/home/ljl/cuda-13.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /home/ljl/cuda-13.0/lib64
      VLLM_SERVER_DEV_MODE: "1"
    launch_command:
      - /home/ljl/.local/bin/uv
      - run
      - vllm
      - serve
      - /home/ljl/models/hf/Qwen2.5-0.5B-Instruct
      - --host
      - 127.0.0.1
      - --port
      - "8101"
      - --served-model-name
      - qwen-a
      - --enable-sleep-mode
      - --gpu-memory-utilization
      - "0.35"
      - --max-model-len
      - "1024"
      - --dtype
      - half
  qwen-b:
    backend_url: http://127.0.0.1:8102
    served_model_name: qwen-b
    sleep_level: 1
    cwd: /home/ljl/research-systems/vllm-model-switch-controller
    env:
      CUDA_HOME: /home/ljl/cuda-13.0
      PATH: /home/ljl/.local/bin:/home/ljl/cuda-13.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /home/ljl/cuda-13.0/lib64
      VLLM_SERVER_DEV_MODE: "1"
    launch_command:
      - /home/ljl/.local/bin/uv
      - run
      - vllm
      - serve
      - /home/ljl/models/hf/Qwen2.5-0.5B-Instruct-B
      - --host
      - 127.0.0.1
      - --port
      - "8102"
      - --served-model-name
      - qwen-b
      - --enable-sleep-mode
      - --gpu-memory-utilization
      - "0.35"
      - --max-model-len
      - "1024"
      - --dtype
      - half
controller:
  host: 127.0.0.1
  port: 9000
  policy: always_sleep_previous
  startup_awake_model: qwen-a
  request_timeout_s: 600
  switch_timeout_s: 600
  metrics_path: results/exp_001/controller_events.jsonl
